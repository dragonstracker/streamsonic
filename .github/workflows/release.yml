name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.22"

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: linux-amd64
          - goos: linux
            goarch: arm64
            asset: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "6"
            asset: linux-armv6
          - goos: darwin
            goarch: amd64
            asset: darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          NAME="${{ matrix.asset }}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.value }}" \
            -o "dist/streamsonic" ./cmd/streamsonic
          mkdir -p "dist/pkg"
          cp dist/streamsonic dist/pkg/streamsonic
          cp install.sh README.md LICENSE streamsonic.conf.example dist/pkg/
          tar -C dist/pkg -czf "dist/streamsonic-${NAME}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: streamsonic-${{ matrix.asset }}
          path: dist/streamsonic-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum streamsonic-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Attach install.sh and notes
        run: |
          cp install.sh dist/install.sh
          cp CHANGELOG.md dist/CHANGELOG.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: streamsonic ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/streamsonic-*.tar.gz
            dist/checksums.txt
            dist/install.sh
          fail_on_unmatched_files: true
